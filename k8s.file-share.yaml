---
apiVersion: v1
kind: ConfigMap
metadata:
    name: file-share-env
data:
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
    # 只读数据目录：下面的 samba-data 卷（SMB 共享的数据根）只读挂到 /samba，
    # 应用从这里扫描目录与文件；它不写这份数据，也不持有文件副本。
    FILES_DIR: "/samba/daveny"
    # 用户表固定读 DATA_DIR/users.yaml：下面的 Secret users 以 subPath 挂成 /data/users.yaml。

---
apiVersion: v1
kind: Secret
metadata:
    name: secrets
type: Opaque
stringData:
    READYZ_TOKEN: "your_readyz_token"
    SESSION_SIGNING_KEY: "your_very_safe_session_signing_key"
    URL_SIGNATURE_KEY: "your_very_safe_url_signature_key"

---
# 用户表：身份列表 + 权限数组。只读视图没有写接口，账号只需 read。
# 密码明文保存在这里，改完重启 Pod 生效。
apiVersion: v1
kind: Secret
metadata:
    name: users
type: Opaque
stringData:
    users.yaml: |
        users:
          - name: admin
            password: "change_me_please"
            permissions: [read]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: file-share-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: file-share
    labels:
        app: file-share
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    # 需要 8080 直接监听宿主时打开（原部署即如此）。
    # hostNetwork: true

    containers:
        - name: app
          image: ghcr.io/hm-service/file-share:latest
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL

          envFrom:
              - configMapRef:
                    name: file-share-env
              - secretRef:
                    name: secrets
          ports:
              - name: http
                containerPort: 8080
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          readinessProbe:
              httpGet:
                  path: /readyz?token=your_readyz_token
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data
              # 用户表：Secret 里的 users.yaml 挂成数据目录下的固定路径，
              # 改用户表要重启 Pod（subPath 挂载不随 Secret 热更新）。
              - name: users
                mountPath: /data/users.yaml
                subPath: users.yaml
                readOnly: true
              # 只读数据卷：SMB 共享的数据根，容器内 /samba/daveny 就是 daveny 用户的目录。
              - name: samba
                mountPath: /samba
                readOnly: true
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: file-share-data
        - name: users
          secret:
              secretName: users
        # SMB 共享的数据卷（samba pod 用的同一个 PVC），只读挂载。
        - name: samba
          persistentVolumeClaim:
              claimName: samba-data
              readOnly: true
