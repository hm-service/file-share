---
apiVersion: v1
kind: ConfigMap
metadata:
    name: env
data:
    HOST: "0.0.0.0"
    PORT: "8080"
    TZ: "Asia/Shanghai"
    DATA_DIR: "/data"
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
    MAX_API_CONCURRENCY: 128
    MAX_AUTH_CONCURRENCY: 32
    MAX_STATIC_CONCURRENCY: 64
    MAX_FILE_SIZE: "2GiB"
    GOMEMLIMIT: "128MiB"

---
apiVersion: v1
kind: Secret
metadata:
    name: secrets
type: Opaque
stringData:
    AUTH_TOKEN: "your_auth_token_123"
    READYZ_TOKEN: "your_readyz_token"
    SESSION_SIGNING_KEY: "your_very_safe_session_signing_key"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: file-share-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: file-share
    labels:
        app: file-share
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          image: ghcr.io/hm-service/file-share:latest
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL

          envFrom:
              - configMapRef:
                    name: env
              - secretRef:
                    name: secrets
          ports:
              - name: http
                containerPort: 8080
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          readinessProbe:
              httpGet:
                  path: /readyz?token=your_readyz_token
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: file-share-data
