name: Build and Push Docker Image

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 在 x86_64 runner 上交叉构建 arm64 需要 QEMU 模拟
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v4
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  # 调整上下文目录
                  context: .
                  push: true
                  provenance: false
                  # 同时构建并推送 amd64 与 arm64 两种架构
                  platforms: linux/amd64,linux/arm64
                  # 同时打上 latest 和 日期 tag
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/file-share:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/file-share:latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/file-share:${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/file-share:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
