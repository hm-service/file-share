<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>现代文件管理系统</title>
        <script src="/static/tailwindcss.js"></script>
        <script src="/static/sha256.umd.min.js"></script>
        <style>
            .drag-over {
                border-color: #3b82f6 !important;
                background-color: #eff6ff !important;
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .sidebar-scroll {
                scrollbar-width: thin;
                scrollbar-color: #d1d5db transparent;
            }
            .sidebar-scroll::-webkit-scrollbar {
                width: 8px;
            }
            .sidebar-scroll::-webkit-scrollbar-track {
                background: transparent;
            }
            .sidebar-scroll::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 4px;
            }
        </style>
    </head>
    <body class="bg-gray-50 h-screen flex overflow-hidden font-sans text-gray-800">
        <div class="flex w-full h-full">
            <div
                class="w-1/3 min-w-[380px] bg-white border-r border-gray-200 flex flex-col h-full shadow-sm"
            >
                <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-6">
                    <div>
                        <h2
                            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2 flex items-center"
                        >
                            <svg
                                class="w-4 h-4 mr-1 text-yellow-400"
                                fill="currentColor"
                                viewBox="0 0 20 20"
                            >
                                <path
                                    d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                                ></path>
                            </svg>
                            收藏
                        </h2>
                        <ul id="favoritesList" class="space-y-2"></ul>
                    </div>
                    <div class="border-t border-dashed border-gray-200"></div>
                    <div>
                        <h2
                            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2"
                        >
                            全部文件
                        </h2>
                        <ul id="othersList" class="space-y-2"></ul>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-gray-50 flex flex-col p-10 relative min-h-0">
                <!-- 上传列表：弹性高度，最高为页面总高度的 1/2，超出后内部滚动 -->
                <div
                    id="uploadQueue"
                    class="w-full max-w-2xl mx-auto flex flex-col min-h-0 mb-6 hidden"
                    style="max-height: 50vh"
                >
                    <h2 class="text-sm font-bold text-gray-600 mb-3 shrink-0">上传队列</h2>
                    <ul id="queueList" class="flex-1 min-h-0 space-y-2 overflow-y-auto no-scrollbar pr-1"></ul>
                </div>

                <!-- 上传 HOT area：占据剩余空间，不再被队列挤动 -->
                <div class="flex-1 min-h-0 w-full max-w-2xl mx-auto flex items-center">
                    <div
                        id="dropzone"
                        class="w-full h-96 max-h-full border-2 border-dashed border-gray-300 rounded-3xl bg-white flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-blue-50 hover:shadow-lg"
                        onclick="document.getElementById('fileInput').click()"
                    >
                    <div
                        id="dropzoneContent"
                        class="text-center flex flex-col items-center pointer-events-none"
                    >
                        <svg
                            class="w-16 h-16 text-gray-400 mb-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                            ></path>
                        </svg>
                        <h3 class="text-xl font-medium text-gray-700 mb-2">
                            点击或将文件拖拽至此处
                        </h3>
                        <p class="text-gray-400 text-sm">支持超大文件，自动秒传校验</p>
                    </div>

                        <input
                            type="file"
                            id="fileInput"
                            class="hidden"
                            multiple
                            onchange="addFiles(this.files)"
                        />
                    </div>
                </div>
            </div>
        </div>

        <script>
            initApp();

            async function initApp() {
                const success = await loadFiles();
                if (!success) {
                    alert("加载文件列表失败，请刷新页面重试");
                }
            }

            function formatTime(timestamp) {
                if (!timestamp) return "时间未知";
                const date = new Date(timestamp * 1000);
                return `${date.getMonth() + 1}-${date.getDate()} ${date.getHours().toString().padStart(2, "0")}:${date.getMinutes().toString().padStart(2, "0")}`;
            }

            function formatSize(bytes) {
                if (!bytes || bytes < 1) return "0 B";
                const k = 1024,
                    sizes = ["B", "KB", "MB", "GB"],
                    i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
            }

            function downloadFile(fileId) {
                window.location.href = `/api/download/${fileId}`;
            }

            function renderFileItem(file) {
                const starColor = file.is_favorite
                    ? "text-yellow-400 hover:text-yellow-500"
                    : "text-gray-300 hover:text-gray-400";
                const actionBtns = `
                <button onclick="toggleFavorite('${file.id}')" class="${starColor} transition" title="收藏/取消收藏">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                </button>
                <button onclick="downloadFile('${file.id}')" class="text-blue-400 hover:text-blue-600 transition" title="下载">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
                <button onclick="copyDirectLink('${file.id}', this)" class="text-green-500 hover:text-green-700 transition" title="复制直链">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-3 3a4 4 0 005.656 5.656l1.5-1.5M10.172 13.828a4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5"></path></svg>
                </button>
                <button onclick="deleteFile('${file.id}', '${file.filename}')" class="text-red-400 hover:text-red-600 transition" title="删除文件">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;

                return `
                <li class="group bg-white border border-gray-100 p-3 rounded-xl shadow-sm hover:shadow-md transition flex items-center justify-between">
                    <div class="flex items-center overflow-hidden flex-1">
                        <div class="mr-3 text-blue-500">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <div class="truncate">
                            <p class="text-sm font-semibold truncate text-gray-800" title="${file.filename}">
                                ${file.filename}
                            </p>
                            <p class="text-[10px] text-gray-400 mt-0.5">
                                ${formatTime(file.update_time)} • ${formatSize(file.size)}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 opacity-0 group-hover:opacity-100 transition-opacity ml-2">
                        ${actionBtns}
                    </div>
                </li>
            `;
            }

            async function loadFiles() {
                try {
                    const res = await fetch("/api/files");
                    if (!res.ok) return false;
                    const data = await res.json();
                    const favorites = data.files.filter((f) => f.is_favorite);
                    const others = data.files.filter((f) => !f.is_favorite);
                    document.getElementById("favoritesList").innerHTML = favorites.length
                        ? favorites.map(renderFileItem).join("")
                        : '<p class="text-xs text-gray-400 px-2 italic">暂无收藏</p>';
                    document.getElementById("othersList").innerHTML = others.length
                        ? others.map(renderFileItem).join("")
                        : '<p class="text-xs text-gray-400 px-2 italic">库中暂无文件</p>';
                    return true;
                } catch (err) {
                    return false;
                }
            }

            async function toggleFavorite(fileId) {
                const res = await fetch(`/api/favorite/${fileId}`, { method: "POST" });
                if (res.ok) loadFiles();
            }

            async function copyDirectLink(fileId, btn) {
                const url = `${location.origin}/api/download/${fileId}`;
                const original = btn.innerHTML;
                try {
                    await navigator.clipboard.writeText(url);
                } catch (err) {
                    // 非安全上下文等情况下回退到 execCommand
                    const ta = document.createElement("textarea");
                    ta.value = url;
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                }
                btn.innerHTML = '<span class="text-xs">已复制</span>';
                setTimeout(() => {
                    btn.innerHTML = original;
                }, 1200);
            }

            async function deleteFile(fileId, filename) {
                if (confirm(`确定要删除记录 "${filename}" 吗？`)) {
                    await fetch(`/api/files/${fileId}`, {
                        method: "DELETE",
                    });
                    loadFiles();
                }
            }

            // ================= 上传队列机制核心 =================
            const dropzone = document.getElementById("dropzone");
            const dropzoneContent = document.getElementById("dropzoneContent");
            const fileInput = document.getElementById("fileInput");
            const queuePanel = document.getElementById("uploadQueue");
            const queueList = document.getElementById("queueList");

            let uploadQueue = []; // 待处理队列
            let isUploading = false; // 是否正在上传
            let pumpRunning = false; // 调度循环是否已启动

            function genQueueId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            }

            function sleep(ms) {
                return new Promise((resolve) => setTimeout(resolve, ms));
            }

            // 用户向队列追加文件：选文件/拖拽后立即入队，上传热区马上复位，可继续添加
            function addFiles(fileList) {
                const files = Array.from(fileList || []);
                if (!files.length) return;

                for (const file of files) {
                    uploadQueue.push({
                        id: genQueueId(),
                        file: file,
                        name: file.name,
                        size: file.size,
                        status: "pending",
                        progress: 0,
                        detail: "等待中...",
                    });
                }

                // 重置上传热区，允许继续添加文件
                fileInput.value = "";
                dropzoneContent.style.display = "flex";
                renderQueue();
                queuePump();
            }

            // 待处理(或失败)的队列项允许移除
            function removeQueueItem(itemId) {
                const idx = uploadQueue.findIndex((i) => i.id === itemId);
                if (idx === -1) return;
                const item = uploadQueue[idx];
                if (item.status !== "pending" && item.status !== "error") return;
                uploadQueue.splice(idx, 1);
                renderQueue();
            }

            function removeItemById(itemId) {
                uploadQueue = uploadQueue.filter((i) => i.id !== itemId);
                renderQueue();
            }

            function renderQueue() {
                if (!uploadQueue.length) {
                    queuePanel.classList.add("hidden");
                    queueList.innerHTML = "";
                    return;
                }
                queuePanel.classList.remove("hidden");
                queueList.innerHTML = uploadQueue.map(renderQueueItem).join("");
            }

            function renderQueueItem(item) {
                const statusText =
                    item.status === "done"
                        ? item.detail || "上传完成"
                        : item.status === "error"
                        ? item.detail || "上传失败"
                        : item.status === "uploading"
                        ? item.detail
                        : "等待中...";

                const canDelete = item.status === "pending" || item.status === "error";
                const deleteBtn = canDelete
                    ? `<button onclick="removeQueueItem('${item.id}')" class="text-xs text-red-400 hover:text-red-600 transition ml-3" title="从队列移除">移除</button>`
                    : "";

                const barColor =
                    item.status === "error"
                        ? "bg-red-500"
                        : item.status === "done"
                        ? "bg-green-500"
                        : "bg-blue-600";

                return `
                <li class="bg-white border border-gray-100 p-3 rounded-xl shadow-sm">
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center overflow-hidden flex-1">
                            <p class="text-sm font-semibold truncate text-gray-800" title="${item.name}">${item.name}</p>
                            <span class="text-[10px] text-gray-400 ml-2 shrink-0">${formatSize(item.size)}</span>
                        </div>
                        <div class="flex items-center shrink-0">
                            <span class="text-xs ${item.status === "error" ? "text-red-500" : item.status === "done" ? "text-green-600" : "text-blue-600"}">${statusText}</span>
                            ${deleteBtn}
                        </div>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                        <div class="${barColor} h-2 rounded-full transition-all duration-200" style="width: ${item.progress}%"></div>
                    </div>
                </li>
            `;
            }

            // 调度循环：正在上传就等待，否则从队列取出一个依次上传
            async function queuePump() {
                if (pumpRunning) return;
                pumpRunning = true;

                while (true) {
                    if (isUploading) {
                        await sleep(100);
                        continue;
                    }
                    const item = uploadQueue.find((i) => i.status === "pending");
                    if (!item) break;
                    isUploading = true;
                    await uploadItem(item);
                    isUploading = false;
                }

                pumpRunning = false;
                loadFiles();
            }

            // 1. 分块计算 SHA256 (高性能版本)，进度回调 0-100
            async function calculateSHA256(file, onProgress) {
                const chunkSize = 10 * 1024 * 1024; // 10MB 的块
                const hasher = await hashwasm.createSHA256();
                hasher.init();

                const chunks = Math.ceil(file.size / chunkSize);
                for (let i = 0; i < chunks; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, file.size);

                    const chunk = file.slice(start, end);
                    const buffer = await chunk.arrayBuffer();
                    hasher.update(new Uint8Array(buffer));
                    if (onProgress) onProgress(Math.round(((i + 1) / chunks) * 100));
                }
                return hasher.digest("hex");
            }

            // 2. 带进度的 XHR 上传，进度回调 0-100
            function uploadFileWithProgress(file, hash, onProgress) {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open("POST", "/api/upload", true);

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable && onProgress) {
                            onProgress(Math.round((e.loaded / e.total) * 100));
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status === 200) resolve();
                        else {
                            let detail = "上传失败";
                            try {
                                detail = JSON.parse(xhr.responseText).detail || detail;
                            } catch (_) {}
                            reject(detail);
                        }
                    };
                    xhr.onerror = () => reject("网络异常");

                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("client_sha256", hash);
                    xhr.send(formData);
                });
            }

            // 3. 单个队列项的上传流程
            async function uploadItem(item) {
                item.status = "uploading";
                item.progress = 0;
                item.detail = "本地计算指纹...";
                renderQueue();

                try {
                    // 第一阶段：计算 Hash (整体进度 0-10%)
                    const hash = await calculateSHA256(item.file, (pct) => {
                        item.detail = `本地计算指纹 ${pct}%`;
                        item.progress = Math.round(pct * 0.1);
                        renderQueue();
                    });

                    // 第二阶段：预检服务器是否已有该文件 (秒传)
                    item.detail = "校验服务器是否已存在...";
                    item.progress = 10;
                    renderQueue();

                    const checkFormData = new FormData();
                    checkFormData.append("client_sha256", hash);
                    checkFormData.append("filename", item.name);

                    const checkRes = await fetch("/api/check_file", {
                        method: "POST",
                        body: checkFormData,
                    });
                    const checkData = await checkRes.json();

                    if (checkData.exists) {
                        // 秒传成功
                        item.status = "done";
                        item.progress = 100;
                        item.detail = "秒传成功";
                        renderQueue();
                        setTimeout(() => removeItemById(item.id), 1200);
                        return;
                    }

                    // 第三阶段：真实上传 (整体进度 10-100%)
                    await uploadFileWithProgress(item.file, hash, (pct) => {
                        item.detail = `上传中 ${pct}% (${formatSize(item.size * pct / 100)} / ${formatSize(item.size)})`;
                        item.progress = Math.round(10 + pct * 0.9);
                        renderQueue();
                    });

                    item.status = "done";
                    item.progress = 100;
                    item.detail = "上传完成";
                    renderQueue();
                    setTimeout(() => removeItemById(item.id), 1200);
                } catch (err) {
                    item.status = "error";
                    item.detail = typeof err === "string" ? err : "上传失败";
                    renderQueue();
                } finally {
                    item.file = null; // 释放大文件引用
                }
            }

            // 拖拽事件监听
            dropzone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropzone.classList.add("drag-over");
            });
            dropzone.addEventListener("dragleave", () => {
                dropzone.classList.remove("drag-over");
            });
            dropzone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropzone.classList.remove("drag-over");
                addFiles(e.dataTransfer.files);
            });
        </script>
    </body>
</html>
